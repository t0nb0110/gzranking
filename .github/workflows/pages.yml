name: Update Notion and deploy Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: notion-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          node --test tests/search.test.mjs
      - name: Fetch and aggregate
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SESSION_SOURCE_ID: ${{ vars.SESSION_SOURCE_ID }}
          CHARACTER_SOURCE_ID: ${{ vars.CHARACTER_SOURCE_ID }}
          DISPLAY_TIMEZONE: Asia/Tokyo
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
